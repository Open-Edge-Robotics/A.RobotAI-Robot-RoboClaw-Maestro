server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://maestro-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /health { proxy_pass http://maestro-api:8000/health; }
  location = /ready { proxy_pass http://maestro-api:8000/ready; }
  location / { try_files $uri /index.html; }
}
