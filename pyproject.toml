[project]
name = "robo-claw-maestro"
version = "0.1.0"
description = "Fleet orchestration platform for Robo-Claw autonomous robots"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "prometheus-client>=0.21.0",
]
robot = [
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
]
tracing = [
    "langsmith>=0.1.100",
]
llm = [
    "httpx>=0.27.0",
]
database = [
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
]
dev = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.21.0",
    "langsmith>=0.1.100",
    "httpx>=0.27.0",
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robo_claw_maestro.agent" = ["knowledge_defaults/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: pure domain unit tests",
    "component: component tests with fakes",
    "integration: tests requiring multiple components",
    "contract: protocol compatibility tests",
    "e2e: end-to-end tests",
    "asyncio: asynchronous tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/robo_claw_maestro/adapters/grpc/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["robo_claw_maestro"]
branch = true
